<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Max · The Performance Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      safelist: [
        // Card accent strips
        'bg-emerald-400', 'bg-gray-300', 'bg-amber-400', 'bg-orange-400',
        // Card label colours
        'text-emerald-600', 'text-gray-400', 'text-amber-600', 'text-orange-600',
        // Card impact colours
        'text-gray-500',
        // Chevron rotation
        'rotate-90',
        // Tag colours used in receipt
        'bg-emerald-100', 'text-emerald-700',
        'bg-blue-100', 'text-blue-700',
        'bg-violet-100', 'text-violet-700',
        'bg-amber-100', 'text-amber-700',
      ]
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #fff7ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const screens = ["brief", "alert", "handled"];

    const SunIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    );

    const BellIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    );

    const CheckIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    const ChevronRight = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    );

    const TrendUp = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
      </svg>
    );

    const MaxAvatar = ({ size = "sm" }) => {
      const dim = size === "sm" ? "w-8 h-8 text-xs" : "w-10 h-10 text-sm";
      return (
        <div className={`${dim} rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center font-semibold text-white flex-shrink-0 shadow-md`}>
          M
        </div>
      );
    };

    function MorningBrief({ onDeepDive }) {
      const [expanded, setExpanded] = useState(null);

      const items = [
        {
          id: 1,
          type: "handled",
          label: "Rates adjusted",
          summary: "Standard Rooms up £22 on Friday",
          detail: "Demand signals from the Padstow Food Festival spiked search traffic +34% for that weekend. I raised Standard Room rates by £22 for Friday night. Projected RevPAR uplift: ~£66. Saturday rates remain unchanged — pickup there is softer.",
          impact: "+£66 projected"
        },
        {
          id: 2,
          type: "info",
          label: "Holding rates · Mon 10 Mar",
          summary: "Didn't follow competitors down",
          detail: "Three competitors dropped rates yesterday afternoon by an average of £18. I modelled the demand curve and held our position — your guest score justifies a premium. You're already ahead on Saturday pickup vs this time last week.",
          impact: "Position maintained"
        },
        {
          id: 3,
          type: "pickup",
          label: "Overnight pickup",
          summary: "Steady — no single day spiked",
          detail: "12 new reservations came in overnight across the next 14 days. No single date spiked significantly. Friday remains your strongest window with 12 Standard Rooms still open. The shoulder nights (Mon–Wed next week) are tracking below pace — I'll flag if they don't improve by Thursday.",
          impact: "12 new bookings"
        },
        {
          id: 5,
          type: "pulse",
          label: "Monthly pulse",
          summary: "March shaping up as your best since August",
          detail: "You're 3.2% ahead of revenue target with 12 days left in March. ADR is running £4 below where we'd like it — volume is compensating but worth watching. The good news: your direct booking share hit 34% this month, above your 30% target. Channel mix is moving in the right direction.\n\nAt this pace, March will be your strongest month since August. I'll keep adjusting to hold that.",
          impact: "↑ On track for best year since 2022"
        },
        {
          id: 4,
          type: "alert",
          label: "New competition",
          summary: "The Cove opens nearby in 6 weeks",
          detail: "A new boutique property — The Cove, 28 rooms — is opening in Padstow in six weeks. I've already added them to your comp set so we can start tracking from day one. I'll surface their initial rate strategy as soon as they go live on OTAs. No action needed from you right now.",
          impact: "Added to comp set ✓"
        },
      ];

      const typeStyle = {
        handled: { accent: "bg-emerald-400", label: "text-emerald-600", impact: "text-emerald-600" },
        info:    { accent: "bg-gray-300",    label: "text-gray-400",    impact: "text-gray-500"   },
        pickup:  { accent: "bg-amber-400",   label: "text-amber-600",   impact: "text-amber-600"  },
        alert:   { accent: "bg-amber-400",   label: "text-amber-600",   impact: "text-amber-600"  },
        pulse:   { accent: "bg-orange-400",  label: "text-orange-600",  impact: "text-orange-600" },
      };

      return (
        <div className="flex flex-col h-full overflow-y-auto">
          <div className="px-5 pt-5 pb-4 bg-white border-b border-gray-100">
            <div className="flex items-start gap-3">
              <MaxAvatar size="md" />
              <div>
                <p className="text-xs text-gray-400 font-medium tracking-wide uppercase">Tuesday · 6:47 AM</p>
                <h2 className="text-gray-900 font-semibold text-base leading-snug mt-0.5">Good morning, Sophie.</h2>
                <p className="text-gray-500 text-sm mt-0.5">Here's your Tuesday at The Marlow.</p>
              </div>
            </div>
          </div>

          <div className="px-5 py-2 bg-white border-b border-gray-100 flex items-center justify-between">
            <div className="flex items-center gap-1.5 text-emerald-600">
              <TrendUp />
              <span className="text-xs font-medium">£4,200 ahead of annual pace</span>
            </div>
            <span className="text-[10px] text-gray-400">best year since 2022 →</span>
          </div>

          <div className="grid grid-cols-3 border-b border-orange-100 bg-orange-50">
            {[
              { label: "Occupancy", value: "87%", sub: "4 rooms open", color: "text-gray-900" },
              { label: "Pickup (24h)", value: "£1,240", sub: "12 new bookings", color: "text-emerald-600" },
              { label: "Check-ins today", value: "18", sub: "incl. 2 returning guests", color: "text-gray-900" },
            ].map((m) => (
              <div key={m.label} className="px-3 py-3 text-center border-r border-gray-100 last:border-r-0">
                <p className="text-[10px] text-gray-400 uppercase tracking-wide font-medium">{m.label}</p>
                <p className={`text-lg font-bold ${m.color} leading-tight mt-0.5`}>{m.value}</p>
                <p className="text-[10px] text-gray-400 mt-0.5">{m.sub}</p>
              </div>
            ))}
          </div>

          <div className="flex-1 px-4 py-4 space-y-2.5 pb-6">
            <p className="text-[11px] text-gray-400 uppercase tracking-widest font-semibold px-1">While you were sleeping</p>
            {items.map((item) => {
              const s = typeStyle[item.type];
              const isOpen = expanded === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setExpanded(isOpen ? null : item.id)}
                  className="w-full text-left rounded-xl border border-gray-100 bg-white pl-5 pr-4 py-3 transition-all shadow-sm hover:shadow-md relative overflow-hidden focus:outline-none"
                >
                  <div className={`absolute left-0 top-0 bottom-0 w-1 ${s.accent}`} />
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="min-w-0">
                        <p className={`text-xs font-semibold uppercase tracking-wide ${s.label}`}>{item.label}</p>
                        <p className="text-sm text-gray-700 font-medium mt-0.5 leading-snug">{item.summary}</p>
                      </div>
                    </div>
                    <div className="flex-shrink-0 flex items-center gap-1.5">
                      <span className="text-[11px] text-gray-400 font-medium hidden">{item.impact}</span>
                      <span className={`transition-transform ${isOpen ? "rotate-90" : ""} text-gray-400`}><ChevronRight /></span>
                    </div>
                  </div>
                  {isOpen && (
                    <div className="mt-3 pt-3 border-t border-gray-100 text-sm text-gray-500 leading-relaxed text-left">
                      {item.detail.split('\n\n').map((para, j) => (
                        <p key={j} className={j > 0 ? "mt-2" : ""}>{para}</p>
                      ))}
                      <p className={`mt-2 text-xs font-semibold ${s.impact}`}>{item.impact}</p>
                      {item.type === "pulse" && (
                        <button
                          onClick={(e) => { e.stopPropagation(); onDeepDive(); }}
                          className="mt-3 w-full bg-orange-500 text-white rounded-xl py-2.5 text-xs font-semibold"
                        >
                          Get the full picture →
                        </button>
                      )}
                    </div>
                  )}
                </button>
              );
            })}
            <div className="pt-2 px-1">
              <p className="text-xs text-gray-400 leading-relaxed">
                That's everything worth knowing. No action needed from you right now — I'll tap you on the shoulder if anything changes.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function AlertCard({ onHandled, alertHandled }) {
      const [state, setState] = useState(alertHandled ? "done" : "idle");

      return (
        <div className="flex flex-col h-full overflow-y-auto">
          <div className="px-5 pt-5 pb-4 bg-white border-b border-gray-100">
            <div className="flex items-center gap-2 mb-1">
              <div className="w-2 h-2 rounded-full bg-amber-400 animate-pulse" />
              <p className="text-xs text-gray-400 font-semibold uppercase tracking-wide">Tuesday · 2:14 PM · Tap on the shoulder</p>
            </div>
            <h2 className="text-gray-900 font-semibold text-base">Sophie, I need a call on this one.</h2>
          </div>

          <div className="flex-1 px-4 py-5 space-y-4 pb-8">
            <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-4">
              <p className="text-xs font-semibold text-amber-700 uppercase tracking-wide mb-1.5">What I spotted</p>
              <p className="text-sm text-gray-800 leading-relaxed">
                A local wedding venue — <span className="font-semibold">Trevose Manor</span> — just announced a confirmed booking for a <span className="font-semibold">Saturday in May</span>. Their weddings typically bring 120 guests, many of whom need local accommodation. Last time they hosted a May wedding (2024), you picked up 6 bookings in 48 hours.
              </p>
            </div>

            <div className="bg-white border border-gray-200 rounded-xl px-4 py-4 shadow-sm">
              <div className="flex items-center gap-2 mb-2">
                <MaxAvatar size="sm" />
                <p className="text-xs font-semibold text-gray-500">Max's read</p>
              </div>
              <p className="text-sm text-gray-700 leading-relaxed">
                You have <span className="font-semibold">8 Standard Rooms and 2 Deluxe Sea Views open</span> that Saturday. If demand follows August's pattern, you could fill 5–6 rooms at your current rate. But wedding guests book fast — you have a window of maybe 12–18 hours before the obvious ones go.
              </p>
              <p className="text-sm text-gray-700 leading-relaxed mt-2">
                I'd suggest a small rate nudge (+£15) on those rooms to capture intent without losing volume. I can also draft a "Local wedding guests welcome" post for your Facebook page to intercept the traffic directly.
              </p>
            </div>

            <div className="bg-orange-50 border border-orange-200 rounded-xl px-4 py-3">
              <p className="text-xs font-semibold text-orange-700 uppercase tracking-wide mb-1">My recommendation</p>
              <p className="text-sm text-gray-700 leading-relaxed">
                Nudge rates <span className="font-semibold">+£15 on Saturday May 17th</span> for Standard Rooms and Deluxe Sea Views, and post a short social intercept. Estimated upside: <span className="font-semibold text-emerald-700">+£375 if 5 rooms convert</span>.
              </p>
            </div>

            {state === "idle" && (
              <div className="space-y-2.5 pt-1">
                <button
                  onClick={() => { setState("thinking"); setTimeout(() => { setState("done"); onHandled(); }, 1800); }}
                  className="w-full bg-orange-500 hover:bg-orange-600 text-white rounded-xl py-3.5 text-sm font-semibold transition-colors shadow-md"
                >
                  Yes — do both
                </button>
                <button className="w-full bg-white border border-gray-200 text-gray-700 rounded-xl py-3 text-sm font-medium hover:bg-gray-50 transition-colors">
                  Just the rate nudge
                </button>
                <button className="w-full text-gray-400 text-sm py-2">Not now</button>
              </div>
            )}

            {state === "thinking" && (
              <div className="flex items-center justify-center gap-3 py-6">
                <div className="w-5 h-5 border-2 border-orange-400 border-t-transparent rounded-full animate-spin" />
                <p className="text-sm text-gray-500">Max is on it…</p>
              </div>
            )}

            {state === "done" && (
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-4 space-y-1.5">
                <div className="flex items-center gap-2 mb-1">
                  <div className="w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center">
                    <CheckIcon />
                  </div>
                  <p className="text-sm font-semibold text-emerald-800">Done. I handled it.</p>
                </div>
                <p className="text-xs text-emerald-700">✓ Standard Rooms and Deluxe Sea Views raised +£15 for Saturday 17 May</p>
                <p className="text-xs text-emerald-700">✓ Facebook post drafted and queued — "Perfect for wedding guests in Padstow"</p>
                <p className="text-xs text-gray-500 mt-2">You'll find both in the receipt log. I'll tell you if bookings come in.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function HandledReceipt({ alertHandled }) {
      const baseLog = [
        {
          time: "06:12 AM",
          title: "Standard Room rate increase · Friday 14 Mar",
          reason: "Padstow Food Festival demand signals (+34% search traffic). Comp set unresponsive.",
          action: "Raised Standard Room rates by £22 for Friday only.",
          impact: "Projected +£66",
          tag: "Pricing",
          tagColor: "bg-emerald-100 text-emerald-700",
        },
        {
          time: "06:14 AM",
          title: "Holding rates — didn't follow competitors down",
          reason: "3 competitors dropped by avg £18. Your guest score justifies a premium position.",
          action: "No rate change made. Monitoring overnight.",
          impact: "Position maintained",
          tag: "Comp strategy",
          tagColor: "bg-blue-100 text-blue-700",
        },
        {
          time: "06:31 AM",
          title: "The Cove added to comp set",
          reason: "New 28-room boutique property opening nearby in 6 weeks. Pre-emptive monitoring.",
          action: "Added The Cove to your active comp set. Will surface rate strategy when they go live on OTAs.",
          impact: "Tracking from day one",
          tag: "Intelligence",
          tagColor: "bg-violet-100 text-violet-700",
        },
      ];

      const weddingItem = {
        time: "2:31 PM",
        title: "Rate nudge · Sat 17 May · Wedding intercept",
        reason: "Trevose Manor confirmed wedding booking. 2024 precedent: 6 bookings in 48 hrs.",
        action: "Standard Rooms and Deluxe Sea Views +£15 for Sat 17 May. Facebook post queued — approved by you.",
        impact: "Projected +£375 if 5 rooms convert",
        tag: "Your call",
        tagColor: "bg-amber-100 text-amber-700",
      };

      const log = alertHandled ? [...baseLog, weddingItem] : baseLog;

      return (
        <div className="flex flex-col h-full overflow-y-auto">
          <div className="px-5 pt-5 pb-4 bg-white border-b border-gray-100">
            <p className="text-xs text-gray-400 font-semibold uppercase tracking-wide mb-1">Tuesday · End of day</p>
            <h2 className="text-gray-900 font-semibold text-base">Here's what I did today.</h2>
            <p className="text-gray-500 text-sm mt-0.5">Everything Max handled while you ran the property.</p>
          </div>

          <div className="grid grid-cols-3 border-b border-orange-100 bg-orange-50">
            {[
              { label: "Actions taken", value: alertHandled ? "4" : "3" },
              { label: "Your calls", value: alertHandled ? "1" : "0" },
              { label: "Projected uplift", value: alertHandled ? "+£441" : "+£66" },
            ].map((m) => (
              <div key={m.label} className="px-3 py-3 text-center border-r border-gray-100 last:border-r-0">
                <p className="text-[10px] text-gray-400 uppercase tracking-wide font-medium">{m.label}</p>
                <p className="text-lg font-bold text-gray-900 leading-tight mt-0.5">{m.value}</p>
              </div>
            ))}
          </div>

          <div className="flex-1 px-4 py-4 space-y-3 pb-8">
            <p className="text-[11px] text-gray-400 uppercase tracking-widest font-semibold px-1">Action log</p>
            {log.map((item, i) => (
              <div key={i} className="bg-white border border-gray-200 rounded-xl px-4 py-3.5 shadow-sm">
                <div className="flex items-start justify-between gap-2 mb-2">
                  <p className="text-sm font-semibold text-gray-800 leading-snug flex-1">{item.title}</p>
                  <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${item.tagColor} flex-shrink-0`}>{item.tag}</span>
                </div>
                <p className="text-xs text-gray-400 mb-1"><span className="font-semibold text-gray-500">Why:</span> {item.reason}</p>
                <p className="text-xs text-gray-400 mb-2"><span className="font-semibold text-gray-500">What I did:</span> {item.action}</p>
                <div className="flex items-center justify-between pt-2 border-t border-gray-100">
                  <p className="text-xs text-emerald-600 font-semibold">{item.impact}</p>
                  <p className="text-[10px] text-gray-300">{item.time}</p>
                </div>
              </div>
            ))}
            <div className="pt-2 px-1">
              <p className="text-xs text-gray-400 leading-relaxed">
                That's your Tuesday. Tomorrow's brief will be ready when you wake up.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ChatOverlay({ onClose }) {
      const [step, setStep] = useState("idle");
      const [messages, setMessages] = useState([]);
      const question = "Will the last 4 rooms sell today? And which channels are we keeping open?";

      const handleAsk = () => {
        setMessages([{ role: "sophie", text: question }]);
        setStep("typing");
        setTimeout(() => {
          setMessages(prev => [...prev, {
            role: "max",
            text: "Based on Tuesday patterns at The Marlow, I'd put the odds at around 60% that you fill 2 of those 4 rooms by this evening — most likely through Booking.com or a walk-in at the desk. The other 2 are harder to call tonight.\n\nRight now you're live on Booking.com, Expedia, and your direct site. I'd suggest closing Expedia for tonight — your commission rate there is the highest and last-minute Tuesday demand rarely justifies it. Booking.com is worth keeping open for walk-ins, and direct is always on.",
            action: "Close Expedia for tonight"
          }]);
          setStep("answered");
        }, 2000);
      };

      const handleAction = () => setStep("actioned");

      return (
        <div className="absolute inset-0 z-20 flex flex-col justify-end" style={{background: "rgba(15,15,30,0.45)"}}>
          <div className="bg-white rounded-t-3xl flex flex-col" style={{height: "74%"}}>
            <div className="flex justify-center pt-3 pb-1 flex-shrink-0">
              <div className="w-8 h-1 bg-gray-200 rounded-full" />
            </div>
            <div className="px-5 py-3 flex items-center justify-between border-b border-gray-100 flex-shrink-0">
              <div className="flex items-center gap-2">
                <MaxAvatar size="sm" />
                <p className="text-sm font-semibold text-gray-800">Ask Max</p>
              </div>
              <button onClick={onClose} className="text-gray-300 hover:text-gray-500 text-lg leading-none">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
              {messages.length === 0 && (
                <div className="pt-2">
                  <p className="text-xs text-gray-400 mb-3 text-center">Suggested</p>
                  <button
                    onClick={handleAsk}
                    className="text-left bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm text-gray-700 leading-relaxed w-full hover:bg-gray-100 transition-colors"
                  >
                    "{question}"
                  </button>
                </div>
              )}
              {messages.map((m, i) => (
                <div key={i} className={`flex ${m.role === "sophie" ? "justify-end" : "justify-start items-end gap-2"}`}>
                  {m.role === "max" && <MaxAvatar size="sm" />}
                  <div className={`max-w-[82%] rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed ${
                    m.role === "sophie" ? "bg-orange-500 text-white" : "bg-gray-100 text-gray-800"
                  }`}>
                    {m.text.split('\n\n').map((para, j) => (
                      <p key={j} className={j > 0 ? "mt-2" : ""}>{para}</p>
                    ))}
                    {m.action && step === "answered" && (
                      <button onClick={handleAction} className="mt-3 w-full bg-orange-500 text-white rounded-xl py-2.5 text-xs font-semibold">
                        {m.action}
                      </button>
                    )}
                    {m.action && step === "actioned" && (
                      <div className="mt-3 flex items-center gap-2 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2">
                        <div className="text-emerald-500"><CheckIcon /></div>
                        <p className="text-xs text-emerald-700 font-semibold">Done — Expedia closed for tonight.</p>
                      </div>
                    )}
                  </div>
                </div>
              ))}
              {step === "typing" && (
                <div className="flex items-end gap-2">
                  <MaxAvatar size="sm" />
                  <div className="bg-gray-100 rounded-2xl px-4 py-3 flex gap-1 items-center">
                    {[0,1,2].map(i => (
                      <div key={i} className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{animationDelay:`${i*0.15}s`}} />
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div className="px-4 py-3 border-t border-gray-100 flex items-center gap-2 flex-shrink-0">
              <div className="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm text-gray-400">Ask Max anything…</div>
              <button className="w-9 h-9 bg-orange-500 rounded-full flex items-center justify-center flex-shrink-0">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DeepDiveOverlay({ onClose }) {
      const [step, setStep] = useState("reading");
      const [sentTo, setSentTo] = useState(null);
      const contacts = [
        { name: "Richard", role: "Owner" },
        { name: "Priya", role: "Revenue Manager" },
        { name: "The team", role: "Group email" },
      ];
      const handleSend = (contact) => { setSentTo(contact); setStep("sent"); };

      return (
        <div className="absolute inset-0 z-20 flex flex-col justify-end" style={{background: "rgba(15,15,30,0.45)"}}>
          <div className="bg-white rounded-t-3xl flex flex-col" style={{height: "82%"}}>
            <div className="flex justify-center pt-3 pb-1 flex-shrink-0">
              <div className="w-8 h-1 bg-gray-200 rounded-full" />
            </div>
            <div className="px-5 py-3 flex items-center justify-between border-b border-gray-100 flex-shrink-0">
              <div className="flex items-center gap-2">
                <MaxAvatar size="sm" />
                <div>
                  <p className="text-sm font-semibold text-gray-800">March · Full picture</p>
                  <p className="text-[10px] text-gray-400">Max's monthly analysis</p>
                </div>
              </div>
              <button onClick={onClose} className="text-gray-300 hover:text-gray-500 text-lg leading-none">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-4 pb-2">
              <div className="flex items-center gap-2 mb-4">
                <div className="w-2 h-2 rounded-full bg-emerald-400 flex-shrink-0" />
                <p className="text-xs font-semibold text-emerald-600">March · On track for best year since 2022</p>
              </div>
              {[
                { label: "Revenue", signal: "+3.2% vs target", signalColor: "text-emerald-600", fill: 100, targetPct: 97, overTarget: true, barColor: "bg-emerald-400", story: "The Food Festival weekend drove £840 of your outperformance. Shoulder days held well too — a sign underlying demand is stronger than six months ago." },
                { label: "Average rate", signal: "−£4 vs target", signalColor: "text-amber-500", fill: 95, targetPct: null, overTarget: false, barColor: "bg-amber-400", story: "Volume is compensating — very few empty nights. But heading into spring I'd like to push rate harder on weekends rather than filling early at a discount." },
                { label: "Direct bookings", signal: "34% share — above 30% target", signalColor: "text-emerald-600", fill: 100, targetPct: 88, overTarget: true, barColor: "bg-emerald-400", story: "Up from 28% in February. Every extra point of direct saves ~£12 per booking — worth around £380 in saved commission vs. last month." },
              ].map((m, i) => (
                <div key={i} className="mb-5">
                  <div className="flex items-baseline justify-between mb-1.5">
                    <p className="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">{m.label}</p>
                    <p className={`text-sm font-bold ${m.signalColor}`}>{m.signal}</p>
                  </div>
                  <div className="relative w-full h-1.5 bg-gray-100 rounded-full mb-2.5">
                    <div className={`h-1.5 rounded-full ${m.barColor}`} style={{width:`${Math.min(m.fill,100)}%`}} />
                    {m.overTarget && m.targetPct && (
                      <div className="absolute top-0 bottom-0 w-0.5 bg-gray-300 rounded-full" style={{left:`${m.targetPct}%`}} />
                    )}
                  </div>
                  <p className="text-xs text-gray-500 leading-relaxed">{m.story}</p>
                </div>
              ))}
              <p className="text-xs text-gray-400 border-t border-gray-100 pt-3 pb-1 leading-relaxed">
                Keep doing what you're doing. I'll flag if anything shifts before month-end.
              </p>
            </div>
            <div className="px-5 py-4 border-t border-gray-100 flex-shrink-0">
              {step === "reading" && (
                <button onClick={() => setStep("picking")} className="w-full bg-orange-500 hover:bg-orange-600 text-white rounded-xl py-3 text-sm font-semibold transition-colors">
                  Email this to…
                </button>
              )}
              {step === "picking" && (
                <div className="space-y-2">
                  <p className="text-xs text-gray-400 text-center mb-2">Send Max's March analysis to</p>
                  {contacts.map(c => (
                    <button key={c.name} onClick={() => handleSend(c)} className="w-full flex items-center justify-between bg-gray-50 hover:bg-orange-50 border border-gray-200 hover:border-orange-200 rounded-xl px-4 py-3 transition-colors">
                      <div className="text-left">
                        <p className="text-sm font-semibold text-gray-800">{c.name}</p>
                        <p className="text-xs text-gray-400">{c.role}</p>
                      </div>
                      <ChevronRight />
                    </button>
                  ))}
                </div>
              )}
              {step === "sent" && (
                <div className="flex items-center justify-center gap-2 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3">
                  <div className="text-emerald-500"><CheckIcon /></div>
                  <p className="text-sm font-semibold text-emerald-700">Sent to {sentTo?.name} · {sentTo?.role}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function MaxPrototype() {
      const [active, setActive] = useState("brief");
      const [alertHandled, setAlertHandled] = useState(false);
      const [chatOpen, setChatOpen] = useState(false);
      const [deepDiveOpen, setDeepDiveOpen] = useState(false);

      const navItems = [
        { id: "brief", label: "Morning Brief", icon: <SunIcon /> },
        { id: "alert", label: "Alert", icon: <BellIcon />, badge: true },
        { id: "handled", label: "I Handled It", icon: <CheckIcon /> },
      ];

      return (
        <div className="min-h-screen bg-orange-50 flex items-center justify-center p-4">
          <div className="relative w-full max-w-sm">
            <div className="text-center mb-4">
              <div className="inline-flex items-center gap-2 bg-white rounded-full px-4 py-1.5 shadow-sm border border-gray-200">
                <div className="w-5 h-5 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white text-[10px] font-bold">M</div>
                <span className="text-sm font-semibold text-gray-700">Max · The Performance Agent</span>
                <span className="text-[10px] bg-orange-100 text-orange-600 font-semibold px-1.5 py-0.5 rounded-full">Prototype</span>
              </div>
            </div>

            <div className="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-gray-200 relative" style={{height:"680px"}}>
              <div className="bg-white px-6 pt-3 pb-1 flex items-center justify-between">
                <span className="text-[11px] font-semibold text-gray-700">9:41</span>
                <div className="w-24 h-5 bg-black rounded-full mx-auto" style={{position:"absolute",left:"50%",transform:"translateX(-50%)",top:"10px",width:"80px",height:"20px"}} />
                <div className="flex items-center gap-1">
                  <div className="flex gap-0.5 items-end h-3">
                    {[2,3,4,5].map(h => <div key={h} className="w-0.5 bg-gray-700 rounded-sm" style={{height:`${h*2}px`}} />)}
                  </div>
                  <div className="w-5 h-2.5 border border-gray-700 rounded-sm relative"><div className="absolute right-0 top-0.5 bottom-0.5 left-0.5 bg-gray-700 rounded-[1px]" style={{right:"2px"}} /></div>
                </div>
              </div>
              <div className="h-2" />

              <div className="flex flex-col" style={{height:"calc(100% - 60px)"}}>
                <div className="flex-1 overflow-hidden">
                  {active === "brief"   && <MorningBrief onDeepDive={() => setDeepDiveOpen(true)} />}
                  {active === "alert"   && <AlertCard onHandled={() => setAlertHandled(true)} alertHandled={alertHandled} />}
                  {active === "handled" && <HandledReceipt alertHandled={alertHandled} />}
                </div>

                <div className="flex border-t border-gray-100 bg-white">
                  {navItems.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => setActive(item.id)}
                      className={`flex-1 flex flex-col items-center gap-1 py-2.5 relative transition-colors ${active === item.id ? "text-orange-500" : "text-gray-400 hover:text-gray-600"}`}
                    >
                      {item.badge && active !== "alert" && (
                        <div className="absolute top-1.5 right-6 w-2 h-2 bg-amber-400 rounded-full" />
                      )}
                      <div className={`transition-colors ${active === item.id ? "text-orange-500" : "text-gray-400"}`}>{item.icon}</div>
                      <span className="text-[10px] font-medium leading-none">{item.label}</span>
                      {active === item.id && <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-5 h-0.5 bg-orange-500 rounded-full" />}
                    </button>
                  ))}
                </div>
              </div>

              {!chatOpen && (
                <button
                  onClick={() => setChatOpen(true)}
                  className="absolute bottom-20 right-4 w-12 h-12 rounded-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center shadow-xl z-10"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                </button>
              )}

              {chatOpen && <ChatOverlay onClose={() => setChatOpen(false)} />}
              {deepDiveOpen && <DeepDiveOverlay onClose={() => setDeepDiveOpen(false)} />}
            </div>

            <div className="flex justify-center mt-3">
              <div className="w-24 h-1 bg-gray-300 rounded-full" />
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MaxPrototype />);
  </script>
</body>
</html>
