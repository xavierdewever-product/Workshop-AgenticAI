<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivy Workshop — Gallery</title>
<style>
/* ── Tokens ──────────────────────────────────────────────────────────── */
:root {
  --orange:   #F26419;
  --orange-l: #FEE8D6;
  --cream:    #FEF6EE;
  --ink:      #1A1A1A;
  --ink2:     #4A4A4A;
  --ink3:     #888888;
  --card:     #FFFFFF;
  --border:   #EDE8E3;
  --green:    #16A34A;
  --green-l:  #DCFCE7;
  --blue:     #3B82F6;
  --blue-l:   #DBEAFE;
  --purple:   #7C3AED;
  --purple-l: #EDE9FE;
  --pink:     #DB2777;
  --pink-l:   #FCE7F3;
  --radius:   14px;
  --shadow:   0 1px 4px rgba(0,0,0,.07), 0 0 0 1px var(--border);
  --shadow-md:0 6px 24px rgba(0,0,0,.11), 0 0 0 1px var(--border);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
}

/* ── Header ──────────────────────────────────────────────────────────── */
.site-header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1280px; margin: 0 auto; padding: 0 24px;
  height: 60px; display: flex; align-items: center; gap: 16px;
}
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--orange);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 15px; color: #fff;
}
.logo-text { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
.logo-sep { width: 1px; height: 20px; background: var(--border); }
.workshop-name { font-size: 13px; color: var(--ink2); font-weight: 500; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.entry-count {
  background: var(--orange-l); color: var(--orange);
  font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
}

/* ── Hero ────────────────────────────────────────────────────────────── */
.hero {
  max-width: 1280px; margin: 0 auto; padding: 48px 24px 32px;
}
.hero-eyebrow {
  font-size: 11px; font-weight: 800; color: var(--orange);
  text-transform: uppercase; letter-spacing: .09em; margin-bottom: 10px;
}
.hero-title {
  font-size: 32px; font-weight: 800; color: var(--ink);
  line-height: 1.15; margin-bottom: 10px;
  letter-spacing: -.02em;
}
.hero-title span { color: var(--orange); }
.hero-sub { font-size: 15px; color: var(--ink2); max-width: 520px; line-height: 1.6; }

/* ── Controls ────────────────────────────────────────────────────────── */
.controls {
  max-width: 1280px; margin: 0 auto; padding: 0 24px 28px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.search-wrap {
  position: relative; flex: 1; min-width: 220px; max-width: 340px;
}
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--ink3); pointer-events: none;
}
.search-input {
  width: 100%; padding: 9px 12px 9px 36px;
  border: 1px solid var(--border); border-radius: 24px;
  background: var(--card); font-size: 13px; color: var(--ink);
  outline: none; font-family: inherit; transition: border-color .15s;
}
.search-input:focus { border-color: var(--orange); }
.search-input::placeholder { color: var(--ink3); }

.filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: var(--card);
  color: var(--ink2); cursor: pointer; transition: all .15s;
}
.filter-btn:hover { border-color: var(--orange); color: var(--orange); }
.filter-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }

.sort-select {
  padding: 7px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 12px; color: var(--ink2); cursor: pointer;
  outline: none; font-family: inherit; margin-left: auto;
}

/* ── Grid ────────────────────────────────────────────────────────────── */
.gallery {
  max-width: 1280px; margin: 0 auto; padding: 0 24px 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}
.no-results {
  grid-column: 1 / -1;
  text-align: center; padding: 60px 20px;
  color: var(--ink3); font-size: 14px;
}
.no-results strong { display: block; font-size: 18px; color: var(--ink2); margin-bottom: 6px; }

/* ── Entry card ──────────────────────────────────────────────────────── */
.entry-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: box-shadow .2s, transform .2s;
  animation: fadeUp .35s ease both;
}
.entry-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* Preview area */
.card-preview {
  height: 190px;
  overflow: hidden;
  position: relative;
  background: var(--cream);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.card-preview iframe {
  width:  200%;
  height: 380px;
  border: none;
  transform: scale(0.5);
  transform-origin: top left;
  pointer-events: none;
}
.card-preview .placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
}
.placeholder-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.placeholder-label { font-size: 11px; color: var(--ink3); }

/* Hover overlay */
.preview-overlay {
  position: absolute; inset: 0;
  background: rgba(242,100,25,.0);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: all .2s;
}
.entry-card:hover .preview-overlay { opacity: 1; background: rgba(242,100,25,.08); }
.open-pill {
  background: var(--orange); color: #fff;
  padding: 8px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 700;
  transform: translateY(4px); transition: transform .2s;
  box-shadow: 0 4px 12px rgba(242,100,25,.4);
}
.entry-card:hover .open-pill { transform: translateY(0); }

/* Card body */
.card-body { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.3; }
.card-author {
  display: flex; align-items: center; gap: 6px; margin-top: 2px;
}
.author-avatar {
  width: 20px; height: 20px; border-radius: 50%;
  font-size: 9px; font-weight: 800; color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.author-name { font-size: 11.5px; color: var(--ink3); }

.card-desc { font-size: 12px; color: var(--ink2); line-height: 1.5; margin-top: 2px; }

.card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.tag {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 20px; letter-spacing: .03em;
}

/* Card footer */
.card-footer {
  padding: 10px 18px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--border);
}
.open-btn {
  background: var(--orange); color: #fff;
  border: none; border-radius: 20px;
  padding: 7px 16px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .15s;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.open-btn:hover { opacity: .85; }
.open-btn svg { width: 11px; height: 11px; }
.file-name { font-size: 10.5px; color: var(--ink3); font-family: monospace; }

/* ── Tag colours ─────────────────────────────────────────────────────── */
.tag-dashboard  { background: var(--orange-l); color: var(--orange); }
.tag-report     { background: var(--blue-l);   color: var(--blue);   }
.tag-chat       { background: var(--green-l);  color: var(--green);  }
.tag-mockup     { background: var(--purple-l); color: var(--purple); }
.tag-tool       { background: var(--pink-l);   color: var(--pink);   }
.tag-ai         { background: #FEF9C3;         color: #854D0E;       }
.tag-whatsapp   { background: #DCFCE7;         color: #15803D;       }

/* ── Group headers ──────────────────────────────────────────────────── */
.group-header {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 14px;
  padding: 8px 0 4px;
}
.group-header:not(:first-child) { margin-top: 16px; }
.group-label {
  font-size: 11px; font-weight: 800; color: var(--ink3);
  text-transform: uppercase; letter-spacing: .09em;
  white-space: nowrap;
}
.group-line {
  flex: 1; height: 1px; background: var(--border);
}
.group-pill {
  font-size: 10px; font-weight: 700;
  padding: 2px 10px; border-radius: 20px;
  white-space: nowrap;
}
.group-pill-mine         { background: var(--orange-l); color: var(--orange); }
.group-pill-participants { background: var(--blue-l);   color: var(--blue);   }

/* ── Add card ────────────────────────────────────────────────────────── */
.add-card {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; min-height: 320px;
  color: var(--ink3); cursor: pointer;
  transition: all .2s; text-align: center; padding: 24px;
}
.add-card:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-l); }
.add-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--border); display: flex; align-items: center;
  justify-content: center; font-size: 22px;
  transition: background .2s;
}
.add-card:hover .add-icon { background: var(--orange); color: #fff; }
.add-label { font-size: 13px; font-weight: 600; }
.add-sub { font-size: 11px; max-width: 180px; line-height: 1.5; }

/* ── Footer ──────────────────────────────────────────────────────────── */
.site-footer {
  border-top: 1px solid var(--border);
  background: var(--card);
  padding: 20px 24px;
  text-align: center;
  font-size: 11.5px; color: var(--ink3);
}
.site-footer strong { color: var(--orange); }

/* ── Responsive ──────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .hero-title { font-size: 24px; }
  .gallery { grid-template-columns: 1fr; padding: 0 16px 48px; }
  .hero, .controls { padding-left: 16px; padding-right: 16px; }
  .sort-select { margin-left: 0; }
}
</style>
</head>
<body>

<!-- ── Site header ──────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-mark">L</div>
      <span class="logo-text">Lighthouse</span>
    </a>
    <div class="logo-sep"></div>
    <span class="workshop-name">AI Reporting Workshop</span>
    <div class="header-right">
      <div class="entry-count" id="count-badge">0 entries</div>
    </div>
  </div>
</header>

<!-- ── Hero ─────────────────────────────────────────────────────────── -->
<section class="hero">
  <div class="hero-eyebrow">Workshop Gallery</div>
  <h1 class="hero-title">What we <span>built</span> today</h1>
  <p class="hero-sub">Explore every example from the session. Click any card to open it in full, or filter by type below.</p>
</section>

<!-- ── Controls ─────────────────────────────────────────────────────── -->
<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Search by title or author…" oninput="renderGallery()">
  </div>
  <div class="filter-btns" id="filterBtns">
    <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">All</button>
    <button class="filter-btn" data-filter="dashboard" onclick="setFilter(this)">Dashboards</button>
    <button class="filter-btn" data-filter="report" onclick="setFilter(this)">Reports</button>
    <button class="filter-btn" data-filter="mockup" onclick="setFilter(this)">Mockups</button>
    <button class="filter-btn" data-filter="chat" onclick="setFilter(this)">Chat / AI</button>
  </div>
  <select class="sort-select" id="sortSelect" onchange="renderGallery()">
    <option value="default">Default order</option>
    <option value="alpha">A → Z</option>
    <option value="author">By author</option>
  </select>
</div>

<!-- ── Gallery ──────────────────────────────────────────────────────── -->
<main class="gallery" id="gallery"></main>

<!-- ── Footer ───────────────────────────────────────────────────────── -->
<footer class="site-footer">
  Built with <strong>Ivy</strong> · Powered by <strong>Lighthouse</strong> · AI Reporting Workshop · February 2026
</footer>

<script>
const ENTRIES = [
  {
    file:        'Sarah-ivy-suite.html',
    title:       'Ivy Suite',
    author:      'Sarah',
    description: 'Three concepts in one: WhatsApp briefing, interactive command centre, and auto-generated PDF report.',
    tags:        ['dashboard', 'ai', 'chat', 'mockup', 'report'],
    color:       '#F26419',
    group:       'mine',
  },
  // ── Participant entries ─────────────────────────────────────────────
  {
    file:        'https://pixel-perfect-capture-53.lovable.app/',
    title:       'Performance Agent',
    author:      'Joel',
    description: 'Mobile-first hotel performance agent — live pricing dashboard, task queue, and voice-enabled AI assistant.',
    tags:        ['dashboard', 'ai', 'chat'],
    color:       '#16A34A',
    group:       'participants',
    isExternal:  true,
    previewImg:  'preview-performance-agent.png',
  },
  {
    file:        'Cedric channel agent.html',
    title:       'Channel Agent',
    author:      'Cedric',
    description: 'AI-powered OTA monitoring panel — auto-resolves connectivity, pricing, and mapping errors across Booking.com and Expedia, with a live action log.',
    tags:        ['dashboard', 'ai', 'tool'],
    color:       '#F59E0B',
    group:       'participants',
  },
  {
    file:        'Sophie-wild-rose-agent.html',
    title:       'Wild Rose · Agent',
    author:      'Sophie',
    description: 'Elegant guest-arrival briefing for a boutique country house — per-guest memory, automated prep tasks, and a conversational morning assistant.',
    tags:        ['chat', 'ai', 'dashboard'],
    color:       '#b85c6e',
    group:       'participants',
  },
  {
    file:        'Flor-Light-now-a-timeline.html',
    title:       'Light · Now & a Timeline',
    author:      'Flor',
    description: 'Dark-mode AI hotel assistant with a year-arc timeline, morning briefing chat, and proactive contract alerts.',
    tags:        ['chat', 'ai', 'dashboard'],
    color:       '#8B5CF6',
    group:       'participants',
  },
  {
    file:        'Delphine-miro-presentation.html',
    title:       'Auditable, not just Agentic',
    author:      'Delphine',
    description: '6-frame vision deck arguing the real differentiator is auditability — trust, strategy reporting, mobile-first, and the Kill Switch.',
    tags:        ['mockup', 'ai'],
    color:       '#7C3AED',
    group:       'participants',
  },
  {
    file:        'Lieselot-lighthouse-agent.html',
    title:       'Hotel Ter Heide Agent',
    author:      'Lieselot',
    description: 'A conversational hotel agent built around Hotel Ter Heide — smart, mobile-first design.',
    tags:        ['chat', 'ai', 'mockup'],
    color:       '#7C3AED',
    group:       'participants',
  },
  {
    file:        'Xavier-reporting-agent-poc.html',
    title:       'Reporting Agent PoC',
    author:      'Xavier',
    description: 'Proof of concept for an AI-powered reporting agent inside Reservation Manager.',
    tags:        ['dashboard', 'ai', 'report'],
    color:       '#0891B2',
    group:       'participants',
  },
  {
    file:        'Nadine-max-prototype-presentation.html',
    title:       'Max — The Performance Agent',
    author:      'Nadine',
    description: 'Meet Max: a named hotel performance agent with a distinct personality and alert system.',
    tags:        ['chat', 'ai', 'dashboard'],
    color:       '#DB2777',
    group:       'participants',
  },
];

// Avatar colours pool
const AVATAR_COLORS = [
  '#F26419','#3B82F6','#16A34A','#7C3AED','#DB2777',
  '#0891B2','#D97706','#65A30D','#DC2626','#2563EB',
];

let activeFilter = 'all';

function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  renderGallery();
}

function tagClass(tag) {
  const map = {
    dashboard: 'tag-dashboard', report: 'tag-report',
    chat: 'tag-chat', mockup: 'tag-mockup',
    tool: 'tag-tool', ai: 'tag-ai', whatsapp: 'tag-whatsapp',
  };
  return map[tag] || 'tag-dashboard';
}

function tagLabel(tag) {
  const map = {
    dashboard:'Dashboard', report:'Report', chat:'Chat',
    mockup:'Mockup', tool:'Tool', ai:'AI', whatsapp:'WhatsApp',
  };
  return map[tag] || tag;
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function renderGallery() {
  const query   = (document.getElementById('searchInput').value || '').toLowerCase();
  const sort    = document.getElementById('sortSelect').value;
  const gallery = document.getElementById('gallery');

  let entries = ENTRIES.filter(e => {
    const matchFilter = activeFilter === 'all' || e.tags.includes(activeFilter);
    const matchSearch = !query
      || e.title.toLowerCase().includes(query)
      || e.author.toLowerCase().includes(query)
      || (e.description || '').toLowerCase().includes(query);
    return matchFilter && matchSearch;
  });

  if (sort === 'alpha')  entries = [...entries].sort((a,b) => a.title.localeCompare(b.title));
  if (sort === 'author') entries = [...entries].sort((a,b) => a.author.localeCompare(b.author));

  document.getElementById('count-badge').textContent =
    ENTRIES.length + ' entr' + (ENTRIES.length === 1 ? 'y' : 'ies');

  gallery.innerHTML = '';

  if (entries.length === 0) {
    gallery.innerHTML = `
      <div class="no-results">
        <strong>No results found</strong>
        Try a different search or filter.
      </div>`;
    return;
  }

  const GROUP_META = {
    mine:         { label: 'My Projects',       pill: 'Sarah',           pillClass: 'group-pill-mine' },
    participants: { label: 'From the Workshop', pill: 'Workshop Entries', pillClass: 'group-pill-participants' },
  };

  const useGroups = sort === 'default' && !query;

  if (useGroups) {
    const buckets = {};
    const groupOrder = [];
    entries.forEach(e => {
      const g = e.group || 'participants';
      if (!buckets[g]) { buckets[g] = []; groupOrder.push(g); }
      buckets[g].push(e);
    });

    let cardIndex = 0;
    groupOrder.forEach(g => {
      const meta = GROUP_META[g] || { label: g, pill: '', pillClass: '' };
      const header = document.createElement('div');
      header.className = 'group-header';
      header.innerHTML = `
        <span class="group-label">${meta.label}</span>
        <span class="group-pill ${meta.pillClass}">${meta.pill}</span>
        <span class="group-line"></span>`;
      gallery.appendChild(header);
      buckets[g].forEach(e => renderCard(e, cardIndex++));
    });
  } else {
    entries.forEach((e, i) => renderCard(e, i));
  }

  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.innerHTML = `
    <div class="add-icon">+</div>
    <div class="add-label">Add your file</div>
    <div class="add-sub">Drop your .html into this folder and add an entry to the ENTRIES array in index.html</div>`;
  gallery.appendChild(addCard);
}

function renderCard(e, i) {
  const gallery = document.getElementById('gallery');
  const color   = e.color || AVATAR_COLORS[i % AVATAR_COLORS.length];
  const card    = document.createElement('div');
  card.className = 'entry-card';
  card.style.animationDelay = (i * 0.05) + 's';

  // Preview area
  let previewHTML;
  if (e.isPDF) {
    previewHTML = `
      <div class="placeholder">
        <div class="placeholder-icon" style="background:${color}20;">📄</div>
        <div class="placeholder-label">PDF Document</div>
      </div>`;
  } else if (e.isExternal) {
    previewHTML = `
      <img src="${e.previewImg || ''}" style="width:100%;height:100%;object-fit:cover;object-position:top;" alt="${e.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="placeholder" style="display:none;">
        <div class="placeholder-icon" style="background:${color}20;font-size:22px;">🔗</div>
        <div class="placeholder-label">External app</div>
      </div>
      <div class="preview-overlay">
        <div class="open-pill">Open ↗</div>
      </div>`;
  } else {
    previewHTML = `
      <iframe src="${e.file}" loading="lazy" title="${e.title}" scrolling="no"></iframe>
      <div class="preview-overlay">
        <div class="open-pill">Open ↗</div>
      </div>`;
  }

  const tagsHTML = e.tags.map(t =>
    `<span class="tag ${tagClass(t)}">${tagLabel(t)}</span>`
  ).join('');

  const fileLabel = e.isExternal
    ? e.file.replace('https://','').replace(/\/$/,'')
    : e.file;

  card.innerHTML = `
    <div class="card-preview">${previewHTML}</div>
    <div class="card-body">
      <div class="card-top">
        <div>
          <div class="card-title">${e.title}</div>
          <div class="card-author">
            <div class="author-avatar" style="background:${color};">${initials(e.author)}</div>
            <span class="author-name">${e.author}</span>
          </div>
        </div>
      </div>
      ${e.description ? `<div class="card-desc">${e.description}</div>` : ''}
      <div class="card-tags">${tagsHTML}</div>
    </div>
    <div class="card-footer">
      <span class="file-name">${fileLabel}</span>
      <a class="open-btn" href="${e.file}" target="_blank" rel="noopener">
        Open
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>`;

  // Make whole card clickable (opens in new tab)
  card.querySelector('.card-preview').style.cursor = 'pointer';
  card.querySelector('.card-preview').addEventListener('click', () => {
    window.open(e.file, '_blank', 'noopener');
  });

  gallery.appendChild(card);
}

// Init
renderGallery();
</script>
</body>
</html>
